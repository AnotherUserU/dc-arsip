<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build And Conqueror · Arsip Siaran</title>
  <meta name="description" content="Arsip siaran server Discord Build And Conqueror.">
  <meta name="theme-color" content="#18201c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cartouche">
    <div class="title-block">
      <h1>Build And<br>Conqueror</h1>
      <p class="subtitle">Arsip siaran server</p>
      <p class="meta" id="meta">Membuka arsip…</p>
    </div>
    <form class="tools" id="tools" role="search">
      <label class="field field-search">
        <span>Cari laporan</span>
        <input id="q" type="search" placeholder="faksi, perang, nama…" autocomplete="off">
      </label>
      <label class="field">
        <span>Channel</span>
        <select id="channel"><option value="">Semua channel</option></select>
      </label>
    </form>
  </header>

  <div class="table">
    <nav class="rail" aria-label="Tanggal arsip">
      <ol id="day-list"></ol>
    </nav>
    <main class="desk">
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div id="feed" aria-busy="true">
        <div class="sheet sheet-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <button class="more" id="more" type="button" hidden>Muat hari sebelumnya</button>
    </main>
  </div>

  <dialog class="lightbox" id="lightbox" aria-label="Gambar lampiran">
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption>
        <span id="lightbox-name"></span>
        <a id="lightbox-open" target="_blank" rel="noopener noreferrer">Buka file asli</a>
        <button type="button" id="lightbox-close">Tutup</button>
      </figcaption>
    </figure>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
