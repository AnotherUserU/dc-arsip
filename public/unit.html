<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build And Conqueror · Perbandingan Unit</title>
  <meta name="description" content="Perbandingan jangkauan dan ketinggian unit Build And Conqueror.">
  <meta name="theme-color" content="#18201c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cartouche">
    <div class="title-block">
      <h1>Build And<br>Conqueror</h1>
      <p class="subtitle">Perbandingan unit</p>
      <nav class="pages" aria-label="Halaman"><a href="./">Arsip siaran</a></nav>
    </div>
    <form class="tools tools-units" id="tools">
      <label class="field">
        <span>Kategori</span>
        <select id="category"></select>
      </label>
      <label class="field">
        <span>Faksi</span>
        <select id="faction"><option value="">Semua faksi</option></select>
      </label>
      <label class="field">
        <span>Urutkan</span>
        <select id="sort">
          <option value="">Faksi</option>
          <option value="missiles">Jangkauan rudal</option>
          <option value="drones">Jangkauan drone</option>
          <option value="altitude">Ketinggian</option>
        </select>
      </label>
    </form>
  </header>

  <main class="units">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="sheet units-sheet" aria-labelledby="units-title">
      <div class="units-head">
        <h2 id="units-title">Memuat…</h2>
        <ul class="legend" aria-label="Keterangan warna">
          <li><i class="key key-drones"></i>Drone</li>
          <li><i class="key key-missiles"></i>Rudal</li>
          <li><i class="key key-guns"></i>Meriam</li>
          <li><i class="key key-altitude"></i>Ketinggian maks</li>
        </ul>
      </div>
      <table class="unit-table">
        <thead>
          <tr><th scope="col">Unit</th><th scope="col">Jangkauan tembak</th><th scope="col">Ketinggian maks</th></tr>
        </thead>
        <tbody id="unit-rows"></tbody>
      </table>
    </section>
  </main>

  <script src="unit.js"></script>
</body>
</html>
