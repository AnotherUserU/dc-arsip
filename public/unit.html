<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="unitsTitle">Build And Conqueror · Perbandingan Unit</title>
  <meta name="description" data-i18n-content="unitsDescription" content="Perbandingan jangkauan, ketinggian, dan amunisi unit Build And Conqueror.">
  <meta name="theme-color" content="#18201c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cartouche">
    <div class="lang-switch" role="group" data-i18n-label="language" aria-label="Bahasa">
      <button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button>
    </div>
    <div class="title-block">
      <h1>Build And<br>Conqueror</h1>
      <p class="subtitle" data-i18n="unitsLink">Perbandingan unit</p>
      <nav class="pages" data-i18n-label="pages" aria-label="Halaman"><a href="./" data-i18n="archiveLink">Arsip siaran</a></nav>
    </div>
    <form class="tools tools-units" id="tools">
      <label class="field">
        <span data-i18n="type">Jenis</span>
        <select id="type"></select>
      </label>
      <label class="field">
        <span data-i18n="category">Kategori</span>
        <select id="category"><option value="" data-i18n="all">Semua</option></select>
      </label>
      <label class="field">
        <span data-i18n="sortBy">Urutkan</span>
        <select id="sort">
          <option value="" data-i18n="category">Kategori</option>
          <option value="missiles" data-i18n="sortMissiles">Jangkauan rudal</option>
          <option value="drones" data-i18n="sortDrones">Jangkauan drone</option>
          <option value="altitude" data-i18n="sortAltitude">Ketinggian</option>
          <option value="ammo" data-i18n="sortAmmo">Amunisi</option>
        </select>
      </label>
    </form>
  </header>

  <main class="units">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="units-head">
      <h2 id="units-title" data-i18n="loading">Memuat…</h2>
      <p class="units-note" data-i18n="unitsNote">Angka tebal = terbaik di antara unit yang tampil. Tanda ? = datanya belum ada.</p>
    </div>
    <div class="faction-grid" id="tables">
      <div class="sheet sheet-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="unit.js"></script>
</body>
</html>
