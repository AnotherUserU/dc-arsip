<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build And Conqueror · Perbandingan Unit</title>
  <meta name="description" content="Perbandingan jangkauan dan ketinggian unit Build And Conqueror.">
  <meta name="theme-color" content="#18201c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cartouche">
    <div class="title-block">
      <h1>Build And<br>Conqueror</h1>
      <p class="subtitle">Perbandingan unit</p>
      <nav class="pages" aria-label="Halaman"><a href="./">Arsip siaran</a></nav>
    </div>
    <form class="tools tools-units" id="tools">
      <label class="field">
        <span>Jenis</span>
        <select id="type"></select>
      </label>
      <label class="field">
        <span>Kategori</span>
        <select id="category"><option value="">Semua</option></select>
      </label>
      <label class="field">
        <span>Urutkan</span>
        <select id="sort">
          <option value="">Kategori</option>
          <option value="missiles">Jangkauan rudal</option>
          <option value="drones">Jangkauan drone</option>
          <option value="altitude">Ketinggian</option>
        </select>
      </label>
    </form>
  </header>

  <main class="units">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="units-head">
      <h2 id="units-title">Memuat…</h2>
      <p class="units-note">Jarak dalam meter. Angka tebal = tertinggi di antara unit yang tampil.</p>
    </div>
    <div class="faction-grid" id="tables">
      <div class="sheet sheet-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </main>

  <script src="unit.js"></script>
</body>
</html>
