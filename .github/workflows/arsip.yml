name: Arsip Discord

on:
  schedule:
    # 7 kali per jam. Repo ini publik, jadi menit Actions gratis; kalau repo dijadikan
    # privat lagi, kuota 2.000 menit/bulan habis sekitar hari ke-12, jadi kurangi ke
    # 2 kali per jam. Menitnya sengaja tidak bulat: di menit 00/30 antrean GitHub penuh
    # dan jadwal sering telat atau dilewati.
    - cron: "3,14,17,24,38,47,56 * * * *"
  workflow_dispatch: # tombol "Run workflow" untuk uji manual

permissions:
  contents: write

concurrency:
  group: arsip-discord
  cancel-in-progress: false

jobs:
  arsip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Uji
        run: python -m unittest -q

      - name: Ambil pesan baru
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        run: python fetch_discord.py

      # Push inilah yang memicu Vercel membangun ulang situs.
      - name: Simpan arsip ke repo
        run: |
          if [ -z "$(git status --porcelain public/ state.json)" ]; then
            echo "Tidak ada berita baru; lewati commit."
            exit 0
          fi
          # Vercel paket Hobby hanya men-deploy commit yang penulisnya pemilik akun;
          # commit atas nama github-actions[bot] akan diblokir.
          git config user.name "AnotherUserU"
          git config user.email "135497792+AnotherUserU@users.noreply.github.com"
          git add public/ state.json
          git commit -m "data: arsip discord $(date -u -d '+7 hours' '+%Y-%m-%d %H:%M')"
          git push
